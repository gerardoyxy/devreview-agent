name: CI
on:
  push:
  pull_request:
env:
  NUDGETHIS_DISABLE_EXECUTION: '1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: npm run build:site
      - run: npm run check
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Application tests (no agents or models)
        run: cargo test --locked -p nudgethis --bin nudgethis
      - run: npm test
      - name: Chromium device emulation (no agents or models)
        if: runner.os == 'Linux'
        env:
          NUDGETHIS_TEST_BROWSER: /usr/bin/google-chrome
        run: node --test tests/device-preview.safe.test.js
