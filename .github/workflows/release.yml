name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  NUDGETHIS_DISABLE_EXECUTION: '1'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:frontend
      - run: cargo test --locked -p nudgethis --bin nudgethis
      - run: cargo build --release --locked -p nudgethis
      - name: Test the release executable without agent execution
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export NUDGETHIS_TEST_BINARY="$GITHUB_WORKSPACE/target/release/nudgethis.exe"
          else
            export NUDGETHIS_TEST_BINARY="$GITHUB_WORKSPACE/target/release/nudgethis"
          fi
          npm test
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: nudgethis-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release version and ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: nudgethis-*
          path: release-assets
          merge-multiple: true
      - name: Verify all archives and assemble checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS.txt
      - name: Publish the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "NudgeThis $RELEASE_TAG" --notes-file docs/release-notes.md
