name: Landing
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'assets/brand/**'
      - 'scripts/build-site.js'
      - 'scripts/build-docs.js'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'tests/installers.safe.test.js'
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'ROADMAP.md'
      - 'scripts/build-brand.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'assets/brand/**'
      - 'scripts/build-site.js'
      - 'scripts/build-docs.js'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'tests/installers.safe.test.js'
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'ROADMAP.md'
      - 'scripts/build-brand.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/site.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release-ready: ${{ steps.release.outputs.ready }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: node --test tests/installers.safe.test.js
      - name: Check that linked downloads are published
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          if gh release view "$tag" --json isDraft --jq 'select(.isDraft == false)' | grep -q false; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Landing built. Deployment waits for the linked portable release; rerun after publication.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nudgethis-landing
          path: dist/site
          include-hidden-files: true
          retention-days: 14
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  installer-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify installer behavior without running the application
        run: node --test tests/installers.safe.test.js
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release-ready == 'true'
    needs: [build, installer-platforms]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish landing
        id: deployment
        uses: actions/deploy-pages@v4
