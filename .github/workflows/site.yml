name: Landing
on:
  push:
    paths:
      - 'apps/site/**'
      - 'scripts/build-site.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'scripts/build-site.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/site.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: nudgethis-landing
          path: dist/site
          include-hidden-files: true
          retention-days: 14
