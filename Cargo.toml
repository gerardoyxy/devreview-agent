[workspace]
members = ["crates/agent-runtime", "crates/devreview"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "signal", "time", "sync", "net", "fs"] }
process-wrap = { version = "10", features = ["tokio1"] }
